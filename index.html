<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OneRepMax</title>
<meta name="description" content="Move-up calls, muscle balance and a weekly plan from your Hevy workouts.">

<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">

<style>
@font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 500; font-display: swap; src: url("assets/fonts/barlow-condensed-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 600; font-display: swap; src: url("assets/fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 700; font-display: swap; src: url("assets/fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-style: italic; font-weight: 800; font-display: swap; src: url("assets/fonts/barlow-condensed-latin-800-italic.woff2") format("woff2"); }
:root {
  --bg: #f6f5f1; --panel: #ffffff; --fg: #1d1f24; --muted: #6b6f78; --line: #e4e2dc;
  --accent: #2f6f4f; --accent-soft: #e3efe8; --warn: #9a6408; --warn-soft: #f6ecd8;
  --bad: #b23b2e; --bad-soft: #f6e1de; --bar: #c9c6bd; --plan: #2b5fb4; --zone: #2b5fb4; --zone-soft: #e1eaf8;
  --brand: #D4FF3A; --on-brand: #0E0F11; --brand-text: #4a5c00;
  --radius: 14px;
  --font: "Barlow Condensed", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0F11; --panel: #17191c; --fg: #F4F4F0; --muted: #A3A5AA; --line: #2a2d33; --brand-text: #D4FF3A;
    --accent: #6fcf97; --accent-soft: #1f3a2b; --warn: #e6b45a; --warn-soft: #3b3020;
    --bad: #f08b7f; --bad-soft: #3d2422; --bar: #464a52; --plan: #7aa7f5; --zone: #7aa7f5; --zone-soft: #1d2e45;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0F11; --panel: #17191c; --fg: #F4F4F0; --muted: #A3A5AA; --line: #2a2d33; --brand-text: #D4FF3A;
  --accent: #6fcf97; --accent-soft: #1f3a2b; --warn: #e6b45a; --warn-soft: #3b3020;
  --bad: #f08b7f; --bad-soft: #3d2422; --bar: #464a52; --plan: #7aa7f5; --zone: #7aa7f5; --zone-soft: #1d2e45;
}
* { box-sizing: border-box; }
html { font-size: 17px; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-tap-highlight-color: transparent; }
body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
button { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(12px + env(safe-area-inset-top)) 0 10px; border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 12px; }
header.top h1 { margin: 0; line-height: 0; }
.logo { height: 26px; width: auto; display: block; }
.logo-dark { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-dark { display: block; } :root:not([data-theme="light"]) .logo-light { display: none; } }
header.top .sub { margin-top: 5px; }
.today-kg, .stat, .tile .big, .prx, .big-target { font-weight: 800; font-style: italic; letter-spacing: 0; }
h2 { font-weight: 700; letter-spacing: .01em; }
nav.tabs button[aria-selected="true"] { color: var(--brand-text) !important; }
.badge.up { background: var(--brand) !important; color: var(--on-brand) !important; }
.btn.primary { background: var(--brand) !important; border-color: var(--brand) !important; color: var(--on-brand) !important; }
.empty .stack { width: min(240px, 70%); height: auto; display: block; margin: 0 auto 18px; }
.empty .stack.logo-dark { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .empty .stack.logo-dark { display: block; } }
header.top .sub { font-size: .78rem; color: var(--muted); }
header.top .grow { flex: 1; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 14px; font-size: .85rem; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
main { padding: 16px 0 24px; }
h2 { font-size: 1.05rem; margin: 20px 0 4px; }
h2:first-child { margin-top: 0; }
.note { color: var(--muted); font-size: .82rem; margin: 0 0 12px; line-height: 1.4; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.row { display: flex; align-items: baseline; gap: 10px; }
.row .grow { flex: 1; min-width: 0; }
.ex { font-weight: 600; font-size: .95rem; }
.kg { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.kg .arrow { color: var(--accent); margin: 0 4px; }
.small { font-size: .8rem; color: var(--muted); line-height: 1.4; margin-top: 4px; }
.mono { font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.ready { background: var(--accent-soft); color: var(--accent); }
.pill.almost { background: var(--warn-soft); color: var(--warn); }
.pill.building { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.pill.new { background: var(--warn-soft); color: var(--warn); }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0 6px; }
.sec-head h2 { margin: 0; }
.key { display: flex; gap: 14px; font-size: .75rem; color: var(--muted); margin: 0 0 10px; }
.key .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.dot.hit, .rep.hit { background: var(--accent-soft); color: var(--accent); }
.dot.miss, .rep.miss { background: var(--bad-soft); color: var(--bad); }
.dot.ramp { background: var(--bg); border: 1px solid var(--line); }
.xc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.xc-top .ex { line-height: 1.3; }
.badge { flex: none; font-size: .75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.badge.up { background: var(--accent); color: var(--panel); }
.badge.close { background: var(--warn-soft); color: var(--warn); }
.badge.neutral { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.badge.stall { background: var(--bad-soft); color: var(--bad); }
.today { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 10px; }
.today-kg { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.today-x { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sets-head { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.sets { display: grid; gap: 5px 6px; align-items: center; text-align: center; font-variant-numeric: tabular-nums; }
.sets .lab { text-align: left; font-size: .72rem; color: var(--muted); }
.sets .hd { font-size: .72rem; color: var(--muted); }
.sets .w { font-size: .88rem; }
.rep { display: block; border-radius: 8px; padding: 5px 0; font-weight: 700; font-size: .95rem; }
.rep.ramp { background: var(--bg); color: var(--muted); border: 1px solid var(--line); padding: 4px 0; }
.lift .more { font-size: .75rem; color: var(--muted); text-align: center; margin-top: 8px; }
.chart { display: block; width: 100%; height: auto; overflow: visible; }
.sel { width: 100%; font: inherit; font-size: .9rem; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); margin-bottom: 10px; }
.stat-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.stat { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.delta { font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.delta.pos, .mval.pos { color: var(--accent); }
.delta.neg, .mval.neg { color: var(--bad); }
.mrow { display: grid; grid-template-columns: 5.6rem 1fr 2.4rem; align-items: center; gap: 10px; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 7px 0; text-align: left; cursor: pointer; }
.mrow:last-of-type { border-bottom: 0; }
.mrow svg { justify-self: start; width: 100%; max-width: 180px; height: 26px; }
.mname { font-size: .88rem; }
.mval { font-size: .88rem; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.mv { display: grid; grid-template-columns: 3.4rem 1fr auto; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
.mv:last-of-type { border-bottom: 0; }
.mv-d { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.mv-e { min-width: 0; }
.iconbtn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; border-radius: 12px; color: var(--fg); cursor: pointer; padding: 0; flex: none; }
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(8, 9, 12, .55); opacity: 0; transition: opacity .2s; }
.scrim.open { opacity: 1; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 21; width: min(330px, 86vw); background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .2s ease-out; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
.drawer.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .drawer, .scrim { transition: none; } }
.dhead { display: flex; align-items: center; justify-content: space-between; padding: 10px 6px 8px 20px; border-bottom: 1px solid var(--line); font-size: 1.05rem; }
.dscroll { flex: 1; overflow-y: auto; }
.grp { font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 16px 20px 4px; }
.mitem { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 10px 20px; background: none; border: 0; text-align: left; cursor: pointer; color: var(--fg); }
.mitem svg { flex: none; color: var(--muted); }
.mitem .mt, .mrowx .mt { display: block; font-size: .95rem; }
.ms { display: block; font-size: .78rem; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.mrowx { padding: 10px 20px; }
.mrowx .mt { margin-bottom: 8px; }
.mseg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.mseg button { border: 0; background: transparent; border-radius: 7px; padding: 9px 0; font-size: .85rem; color: var(--muted); cursor: pointer; }
.mseg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); font-weight: 700; }
.howto { margin: 0 20px 8px 56px; padding: 0 0 0 16px; font-size: .82rem; line-height: 1.5; color: var(--muted); }
.mitem.danger, .mitem.danger svg { color: var(--bad); }
.mitem.danger { border-top: 1px solid var(--line); }
.dfoot { font-size: .72rem; color: var(--muted); padding: 2px 20px 16px; }
.badge.zone { background: var(--zone-soft); color: var(--zone); }
.ptile { display: flex; flex-direction: column; gap: 12px; }
.pbars { display: flex; flex-direction: column; gap: 12px; margin: 2px 0 12px; }
.ptile .pbars { margin: 0; }
.phero { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.prx { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.plab { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.pval { font-size: .78rem; font-weight: 700; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
.pscale { position: relative; height: 14px; background: var(--bg); border-radius: 7px; }
.pgrad { position: absolute; inset: 0; border-radius: 7px; background: linear-gradient(90deg, #7f1d1d 0%, #166534 100%); opacity: .22; }
.pfill2 { position: absolute; inset: 0; border-radius: 7px; background: linear-gradient(90deg, #7f1d1d 0%, #166534 100%); }
.pzone { position: absolute; top: -2px; height: 18px; border: 1px dashed var(--fg); opacity: .5; border-radius: 4px; }
.pmark { position: absolute; top: -4px; width: 4px; height: 22px; margin-left: -2px; border-radius: 2px; background: var(--fg); }
.pticks { position: relative; height: 14px; margin-top: 4px; font-size: .64rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pticks span { position: absolute; transform: translateX(-50%); }
.pmeter { position: relative; height: 12px; background: var(--bg); border-radius: 6px; }
.pband { position: absolute; top: 0; height: 12px; border-radius: 6px; background: var(--accent-soft); }
.pfill { position: absolute; left: 0; top: 3px; height: 6px; border-radius: 3px; }
.popt { position: absolute; top: -3px; width: 2px; height: 18px; margin-left: -1px; background: var(--fg); opacity: .7; }
.rep.over, .dot.over { background: var(--warn-soft); color: var(--warn); }
.rep.plan { background: transparent; color: var(--fg); border: 1.5px dashed var(--zone); padding: 3.5px 0; }
.dot.plan { background: transparent; border: 1.5px dashed var(--zone); }
.back { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 10px 8px 10px 0; min-height: 44px; color: var(--brand-text); font-weight: 700; cursor: pointer; }
.zt { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.zr { display: grid; grid-template-columns: 5rem repeat(3, minmax(0, 1fr)); gap: 8px; align-items: center; padding: 11px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); text-align: center; font-variant-numeric: tabular-nums; }
.zr .zz { text-align: left; font-weight: 700; }
.zr.zh { background: none; border: 0; padding-top: 0; padding-bottom: 0; font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.zr.zh .zz { font-weight: 400; }
.zr.hl { background: var(--zone-soft); border-color: var(--zone); }
.zw { grid-column: 1 / -1; text-align: left; font-size: .75rem; color: var(--zone); margin-top: -2px; }
.how { display: flex; gap: 14px; align-items: center; padding: 8px 0; }
.how-v { flex: none; width: 96px; }
.how p { margin: 0; font-size: .88rem; line-height: 1.4; }
.nlist { padding: 4px 14px; gap: 0; }
.nx { padding: 4px 14px 14px; }
.nx .nl-row { border-bottom: 0; min-height: 56px; }
.nx .sets .rep.plan { font-size: .95rem; }
.nl-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 10px 0; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; color: var(--fg); cursor: pointer; }
.nl-row:last-child { border-bottom: 0; }
div.nl-row { cursor: default; }
.nl-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.nl-ex { font-size: 1rem; font-weight: 600; line-height: 1.25; }
.nl-kg { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.nl-up { display: inline-block; background: var(--brand); color: var(--on-brand); font-weight: 800; border-radius: 999px; padding: 0 7px; margin-left: 4px; font-size: .8rem; }
.nl-sr { font-size: 1.45rem; font-weight: 800; font-style: italic; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nl-chev { width: 16px; flex: none; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 6px; }
.tile .big { font-size: 1.9rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .lbl { font-size: .78rem; color: var(--muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: none; }
.chips button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: .82rem; cursor: pointer; white-space: nowrap; }
.chips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.lift { cursor: pointer; }
.lift .detail { display: none; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.lift.open .detail { display: block; }
.spark { width: 100%; height: 90px; display: block; }
.bal-row { display: grid; grid-template-columns: 6.2rem 1fr 2.6rem; align-items: center; gap: 8px; padding: 7px 0; }
.bal-row .name { font-size: .85rem; }
.bal-row .val { font-size: .82rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.track { position: relative; height: 16px; }
.track .bar { position: absolute; left: 0; top: 2px; height: 12px; border-radius: 6px; background: var(--bar); }
.track .bar.under { background: var(--bad); }
.track .tgt { position: absolute; top: -3px; width: 2px; height: 22px; background: var(--fg); opacity: .7; border-radius: 1px; }
.track .pl { position: absolute; top: 1px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2.5px solid var(--plan); background: var(--panel); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .75rem; color: var(--muted); margin: 4px 0 6px; }
.sw { display: inline-block; width: 12px; height: 8px; border-radius: 3px; margin-right: 5px; vertical-align: 0; }
table.plan { width: 100%; border-collapse: collapse; font-size: .85rem; }
table.plan td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.plan tr:last-child td { border-bottom: 0; }
table.plan td.r { text-align: right; white-space: nowrap; padding-left: 8px; font-variant-numeric: tabular-nums; }
.pl-item { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.pl-item:last-child { border-bottom: 0; }
.pl-item .grow { flex: 1; min-width: 0; }
.pl-item .kg { text-align: right; max-width: 45%; }
.dayhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.dayhead b { font-size: .98rem; }
.next-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
.next-item:last-child { border-bottom: 0; }
.big-target { font-size: 1.1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(5, 1fr); padding: 0; }
nav.tabs button { background: none; border: 0; padding: 10px 0 12px; font-size: .74rem; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-selected="true"] { color: var(--accent); font-weight: 600; }
.empty { text-align: center; padding: 40px 8px; }
.empty h2 { font-size: 1.3rem; margin-bottom: 8px; }
.empty ol { text-align: left; display: inline-block; margin: 8px 0 20px; padding-left: 20px; line-height: 1.6; font-size: .9rem; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .85rem; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 10; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
ul.rules { margin: 0; padding-left: 18px; font-size: .85rem; line-height: 1.5; }
ul.rules li { margin-bottom: 6px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="grow"><h1><img class="logo logo-light" src="assets/logo-horizontal-on-light.svg" alt="OneRepMax" width="101" height="26"><img class="logo logo-dark" src="assets/logo-horizontal-on-dark.svg" alt="OneRepMax" width="101" height="26"></h1><div class="sub" id="sub">No workouts imported yet</div></div>
  <button class="iconbtn" id="menuBtn" type="button" aria-label="Menu" aria-controls="drawer"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <input type="file" id="file" accept=".csv,text/csv,text/comma-separated-values,text/plain" hidden>
</div></header>
